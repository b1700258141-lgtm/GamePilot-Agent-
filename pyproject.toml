[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gamepilot"
version = "0.1.0"
description = "GamePilot：面向游戏测试 Agent 的确定性回合制战斗靶场（第一阶段）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    # 测试执行器（gamepilot.testing）用 httpx 作为运行期 HTTP 客户端，
    # 因此它是运行依赖而不是 dev 依赖：装上包就能跑 run/replay。
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "anyio>=4.4",
    "pytest>=8.4",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gamepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "postgres: 需要真实 PostgreSQL 的集成测试（需显式设置 TEST_DATABASE_URL）",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# .codex-temp 是另一个 Agent 工具链留下的临时目录，本机权限不可读：
# ruff format 扫描到它会直接 panic（ruff 的已知行为），排除后与源码无关。
extend-exclude = [".agents", ".claude", ".venv", ".codex-temp"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["gamepilot"]
# 项目根目录存在同名的 alembic/ 迁移目录，会被自动判定为本地包；
# 这里显式声明 alembic 是第三方依赖，保证导入分组稳定。
known-third-party = ["alembic"]
