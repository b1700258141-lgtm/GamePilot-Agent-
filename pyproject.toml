[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gamepilot"
version = "0.1.0"
description = "GamePilot：面向游戏测试 Agent 的确定性回合制战斗靶场（第一阶段）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "anyio>=4.4",
    "httpx>=0.27",
    "pytest>=8.4",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gamepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", ".claude", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["gamepilot"]
