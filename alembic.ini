# Alembic configuration. Only options actually used by this project are kept.
#
# NOTE: this file must stay ASCII-only. Alembic reads it with the system locale
# encoding (configparser default), which is not UTF-8 on Chinese Windows and
# would fail on non-ASCII characters. Use English comments here.
#
# sqlalchemy.url is deliberately NOT configured: alembic/env.py reads the
# connection URL from gamepilot.config.Settings (the DATABASE_URL environment
# variable or a local .env file), so no credentials live in version control.

[alembic]
# Migration script location. %(here)s keeps it independent of the CWD.
script_location = %(here)s/alembic

# Let env.py import the installed (editable) gamepilot package.
prepend_sys_path = .

path_separator = os


# Automatically lint and format newly generated revision files, so that
# files under alembic/versions also satisfy the project's ruff quality gates.
[post_write_hooks]
hooks = ruff_check, ruff_format

ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME


# Logging: show Alembic's own INFO logs, keep SQL statements quiet.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
